name: Node CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
        with:
          # `pnpm check` replays known defects from history to confirm the fuzz
          # suites still catch them, so it needs more than the default shallow
          # clone. See scripts/check-fuzz-catches.mjs.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check quality, types, build, and tests
        run: |
          pnpm check
        env:
          CI: true
